# Loop over services defined in values.yaml and create a Service for each
{{- $releaseNamespace := .Release.Namespace }}
{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name | quote }}
  namespace: {{ $releaseNamespace }}
spec:
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: {{ .port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .name }}-ep
  labels:
    kubernetes.io/service-name: {{ .name | quote }}
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: {{ .port }}
endpoints:
  - addresses:
      - {{ .ip | quote }}
    conditions:
      ready: true
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: {{ $releaseNamespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-cloudflare
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
{{- range .Values.services }}
        - {{ .hostname | quote }}
{{- end }}
      secretName: homelab-wildcard-tls
  rules:
{{- range .Values.services }}
    - host: {{ .hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name | quote }}
                port:
                  number: {{ .port }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: {{ .Values.ingress.namespace }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.ingress.ip }}
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
  selector:
    app.kubernetes.io/name: ingress-nginx