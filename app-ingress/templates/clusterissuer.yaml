apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer.name }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.issuer.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuer.accountSecret }}
    solvers:
    - dns01:
        cloudflare:
          # Using the global API key method. Put the secret in the cert-manager namespace.
          apiKeySecretRef:
            name: {{ .Values.issuer.cloudflareSecret.name }}
            key: {{ .Values.issuer.cloudflareSecret.key }}
          email: {{ .Values.issuer.email | quote }}
